<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avantes Spectrometer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f0f0f0;
    color: #222;
  }
  .app { display: flex; min-height: 100vh; flex-wrap: wrap; }
  .left { flex: 1 1 600px; min-width: 0; padding: 12px; }
  .right {
    flex: 0 1 340px; min-width: 0; max-width: 100%;
    min-height: 100vh; background: #e8e8e8; padding: 15px;
  }
  @media (max-width: 700px) {
    .right { flex-basis: 100%; min-height: auto; }
  }
  #plot { width: 100%; height: 60vh; min-height: 320px; background: white; border: 1px solid #ccc; }
  .plot-wrap { position: relative; }
  .no-data-msg {
    position: absolute; top: 12px; left: 16px;
    font-size: 15px; font-weight: bold; color: #e53935;
    animation: blink 1s steps(1) infinite; pointer-events: none;
  }
  @keyframes blink { 50% { opacity: 0; } }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 17px; margin: 18px 0 8px; text-transform: uppercase; color: #444; }
  label { display: block; font-size: 16px; font-weight: 600; margin: 10px 0 4px; }
  input, select {
    width: 100%; padding: 10px; font-size: 17px; border: 1px solid #bbb; border-radius: 4px;
  }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .button {
    width: 100%; padding: 12px; margin: 5px 0; font-size: 15px; font-weight: bold;
    border: 2px solid #333; background: #f8f8f8; cursor: pointer; border-radius: 4px;
  }
  .button:active { background: #d0d0d0; }
  .button.primary { background: #4CAF50; color: white; border-color: #2d6b2f; }
  .button.danger { background: #f44336; color: white; border-color: #9a0007; }
  .button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { font-size: 17px; background: white; border-radius: 4px; padding: 14px; margin-top: 10px; }
  .status div { display: flex; justify-content: flex-start; align-items: center; gap: 10px; padding: 5px 0; }
  .pill {
    padding: 2px 10px; border-radius: 12px; font-weight: bold; color: white;
  }
  .pill.run-on  { background: #4CAF50; }
  .pill.run-off { background: #f44336; }
  .btn-viewer {
    display: block; text-align: center; margin-top: 16px;
    padding: 6px; font-size: 18px; font-weight: bold; text-decoration: underline;
    color: #1565C0; background: none; border: none;
  }
  .btn-viewer:active { color: #0d47a1; }
  .logs {
    margin-top: 10px; height: 160px; overflow-y: auto; background: #1e1e1e; color: #ddd;
    font-family: "Courier New", monospace; font-size: 12px; border-radius: 4px; padding: 8px;
  }
  .logs .line { white-space: pre-wrap; word-break: break-word; padding: 1px 0; }
  .logs .t { color: #888; }
  .logs .lvl-ERROR   { color: #ff6b6b; }
  .logs .lvl-WARNING { color: #ffb84d; }
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <h1>Avantes Spectrometer — Acquisition</h1>
    <div class="plot-wrap">
      <canvas id="plot"></canvas>
      <div class="no-data-msg" id="no-data-msg">No data — press START</div>
    </div>
    <div class="status" id="status"></div>
    <h2>Backend Logs</h2>
    <div class="logs" id="logs"></div>
  </div>

  <div class="right">
    <h2>Spec Param</h2>
    <label for="ti_ms">Integration time (ms)</label>
    <input type="number" id="ti_ms" value="100" min="1" step="1">

    <label for="mode">Acquisition mode</label>
    <select id="mode">
      <option value="SINGLE">Single spectrum (SINGLE)</option>
      <option value="CONTINUOUS">Continuous (CONTINUOUS)</option>
    </select>

    <div class="row">
      <div>
        <label for="delay_s">Delay (s)</label>
        <input type="number" id="delay_s" value="1" min="0" step="0.1">
      </div>
      <div>
        <label for="num_averages">Averages</label>
        <input type="number" id="num_averages" value="1" min="1" step="1">
      </div>
    </div>

    <label for="filter_size">Smoothing filter (px)</label>
    <input type="number" id="filter_size" value="1" min="1" step="1">

    <h2>Acquisition</h2>
    <div class="row">
      <button class="button primary" id="btn-start">START</button>
      <button class="button danger" id="btn-stop">STOP</button>
    </div>

    <h2>SAVE</h2>
    <label for="sample_name">Sample name</label>
    <input type="text" id="sample_name" value="sample">

    <label for="save_path">Folder</label>
    <input type="text" id="save_path" value="/data">

    <div class="row">
      <button class="button primary" id="btn-record-start">Start recording</button>
      <button class="button danger" id="btn-record-stop">Stop recording</button>
    </div>
    <button class="button" id="btn-save">Save recording</button>

    <h2>Spectrometer</h2>
    <button class="button" id="btn-reconnect">Reconnect</button>

    <div id="calib-section" style="display:none;">
      <p style="font-size:13px;color:#c62828;font-weight:bold;margin:10px 0 4px;">
        Unknown spectrometer — enter wavelength calibration (λ = c0 + c1·px + c2·px² + c3·px³):
      </p>
      <div class="row">
        <div><label for="calib_c0">c0</label><input type="number" id="calib_c0" step="any"></div>
        <div><label for="calib_c1">c1</label><input type="number" id="calib_c1" step="any"></div>
      </div>
      <div class="row">
        <div><label for="calib_c2">c2</label><input type="number" id="calib_c2" step="any"></div>
        <div><label for="calib_c3">c3</label><input type="number" id="calib_c3" step="any"></div>
      </div>
      <div class="row">
        <div><label for="calib_wmin">λ min (nm)</label><input type="number" id="calib_wmin" step="any"></div>
        <div><label for="calib_wmax">λ max (nm)</label><input type="number" id="calib_wmax" step="any"></div>
      </div>
      <button class="button primary" id="btn-calib-save">Save calibration</button>
    </div>

    <a class="btn-viewer" href="viewer.html">📁 View saved spectra</a>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const logsEl = $('logs');
const canvas = $('plot');
const ctx = canvas.getContext('2d');
const noDataEl = $('no-data-msg');

let lastStatus = null;
let lastSpectrum = null;

function resizeCanvas() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
  drawPlot();
}
window.addEventListener('resize', resizeCanvas);

function drawPlot() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  noDataEl.style.display = lastSpectrum ? 'none' : 'block';
  if (!lastSpectrum) return;
  const { wavelengths, intensities } = lastSpectrum;
  const pad = 40 * devicePixelRatio;
  const xs = wavelengths, ys = intensities;
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = 0, yMax = Math.max(65535, ...ys);

  const xScale = (x) => pad + (x - xMin) / (xMax - xMin) * (w - 2 * pad);
  const yScale = (y) => h - pad - (y - yMin) / (yMax - yMin) * (h - 2 * pad);

  // ejes
  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad, pad); ctx.lineTo(pad, h - pad); ctx.lineTo(w - pad, h - pad);
  ctx.stroke();

  // curva
  ctx.strokeStyle = '#2d6b2f';
  ctx.lineWidth = 1.5 * devicePixelRatio;
  ctx.beginPath();
  xs.forEach((x, i) => {
    const px = xScale(x), py = yScale(ys[i]);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.stroke();

  ctx.fillStyle = '#555';
  ctx.font = `${11 * devicePixelRatio}px sans-serif`;
  ctx.fillText(`${xMin.toFixed(0)} nm`, pad, h - pad + 14 * devicePixelRatio);
  ctx.fillText(`${xMax.toFixed(0)} nm`, w - pad - 40 * devicePixelRatio, h - pad + 14 * devicePixelRatio);
  ctx.fillText(`${yMax.toFixed(0)}`, 2 * devicePixelRatio, pad);
}

function renderStatus() {
  if (!lastStatus) { statusEl.innerHTML = 'Loading status...'; return; }
  const s = lastStatus;
  const connPill = s.spectrometer_connected
    ? `<span class="pill run-on">Connected</span>`
    : `<span class="pill run-off">Disconnected</span>`;
  const runPill = s.is_running
    ? `<span class="pill run-on">Running${s.current_mode ? ' (' + s.current_mode + ')' : ''}</span>`
    : `<span class="pill run-off">Stopped</span>`;
  statusEl.innerHTML = `
    <div><span><b>Spectrometer</b></span>${connPill}</div>
    <div><span><b>Acquisition</b></span>${runPill}</div>
    ${lastSpectrum ? `<div><span><b>Peak</b></span><span>${lastSpectrum.peak_counts} cnt (${lastSpectrum.sat_pct}%)</span></div>` : ''}
    ${s.last_error ? `<div><span><b>Error</b></span><span>${s.last_error}</span></div>` : ''}
  `;
  $('calib-section').style.display = s.needs_calibration ? 'block' : 'none';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function renderLogs(lines) {
  const nearBottom = logsEl.scrollHeight - logsEl.scrollTop - logsEl.clientHeight < 30;
  logsEl.innerHTML = lines.map((l) =>
    `<div class="line"><span class="t">${l.t}</span> <span class="lvl-${l.level}">${escapeHtml(l.msg)}</span></div>`
  ).join('');
  if (nearBottom) logsEl.scrollTop = logsEl.scrollHeight;
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  return res.json();
}

function buildConfig() {
  return {
    mode: $('mode').value,
    spec_params: {
      ti_ms: parseFloat($('ti_ms').value),
      delay_s: parseFloat($('delay_s').value),
      num_averages: parseInt($('num_averages').value, 10),
      filter_size: parseInt($('filter_size').value, 10),
    },
    metadata: {
      save_path: $('save_path').value,
      sample_name: $('sample_name').value,
    },
  };
}

// Refresca estado y logs de inmediato tras una acción, sin esperar al poll periódico.
async function refreshNow() {
  await Promise.all([pollStatus(), pollLogs()]);
}

async function applyConfig() {
  await api('/api/config', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(buildConfig()),
  });
  refreshNow();
}

// Aplica la configuración automáticamente ante cualquier cambio de parámetro.
['ti_ms', 'mode', 'delay_s', 'num_averages', 'filter_size', 'sample_name', 'save_path']
  .forEach((id) => $(id).addEventListener('change', applyConfig));

$('btn-start').onclick = async () => {
  logsEl.innerHTML = '';   // limpieza inmediata en la UI (el backend limpia su buffer al arrancar)
  await api('/api/start', { method: 'POST' });
  refreshNow();
};

$('btn-stop').onclick = async () => {
  await api('/api/stop', { method: 'POST' });
  refreshNow();
};

$('btn-record-start').onclick = async () => {
  await api('/api/record/start', { method: 'POST' });
  refreshNow();
};

$('btn-record-stop').onclick = async () => {
  await api('/api/record/stop', { method: 'POST' });
  refreshNow();
};

$('btn-save').onclick = async () => {
  await api('/api/save', { method: 'POST' });
  refreshNow();
};

$('btn-reconnect').onclick = async () => {
  await api('/api/spectrometer/reconnect', { method: 'POST' });
  refreshNow();
};

$('btn-calib-save').onclick = async () => {
  const body = {
    c0: parseFloat($('calib_c0').value),
    c1: parseFloat($('calib_c1').value),
    c2: parseFloat($('calib_c2').value),
    c3: parseFloat($('calib_c3').value),
  };
  const wmin = $('calib_wmin').value, wmax = $('calib_wmax').value;
  if (wmin !== '') body.wave_min = parseFloat(wmin);
  if (wmax !== '') body.wave_max = parseFloat(wmax);
  await api('/api/spectrometer/calibration', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  refreshNow();
};

async function pollStatus() {
  try {
    lastStatus = await api('/api/status');
    renderStatus();
  } catch (e) { /* backend no disponible aún */ }
}

async function pollLogs() {
  try {
    const r = await api('/api/logs');
    renderLogs(r.logs || []);
  } catch (e) { /* backend no disponible aún */ }
}

setInterval(pollStatus, 2000);
setInterval(pollLogs, 2000);
pollStatus();
pollLogs();

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/spectrum`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'spectrum') {
      lastSpectrum = msg;
      drawPlot();
      renderStatus();
    }
  };
  ws.onclose = () => setTimeout(connectWS, 3000);
  ws.onerror = () => ws.close();
}

resizeCanvas();
connectWS();
applyConfig();   // aplica la configuración inicial (valores por defecto de los campos)
</script>
</body>
</html>
