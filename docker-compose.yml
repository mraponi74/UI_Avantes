services:
  avantes-ui:
    build: .
    image: mraponi74/ui-avantes:latest
    container_name: avantes-spectrometer-ui
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    # privileged + a real bind mount (not `devices:`) of /dev/bus/usb — this
    # gives the container a live view of the host's USB tree, so a
    # spectrometer replug (which gets a new device number) is picked up
    # without recreating the container. `devices:` instead snapshots the
    # device nodes that existed at container creation, which goes stale on
    # any USB replug/power-cycle.
    privileged: true
    volumes:
      - ./data:/data
      - /dev/bus/usb:/dev/bus/usb
